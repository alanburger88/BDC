<!doctype html>

  <script src="js/app.js" defer></script>
</head>

  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="app" id="app">
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <a class="brand-home" href="#/welcome" id="brand-home">
            <img class="brand-logo" src="assets/logos/infoslips-logo-dark.png" width="575" height="136" alt="InfoSlips walkthrough home">
          </a>
          <span class="brand-for">
            <span class="brand-for-label" aria-hidden="true">Prepared for</span>
            <img class="brand-bdc" src="assets/logos/bdc-logo.webp" width="1186" height="625" alt="Prepared for BDC">
          </span>
        </div>
        <nav class="parts" aria-label="Walkthrough parts">
          <ol class="parts-list" id="parts-list"></ol>
        </nav>
        <div class="topbar-actions">
          <button type="button" class="btn btn-quiet" id="btn-contents" aria-haspopup="dialog">
            <svg class="icon" aria-hidden="true"><use href="#i-contents"/></svg><span class="btn-label">Contents</span>
          </button>
          <a class="btn btn-quiet" id="btn-open" href="notice/" target="_blank" rel="noopener">
            <svg class="icon" aria-hidden="true"><use href="#i-external"/></svg><span class="btn-label">Open live statement</span><span class="sr-only"> (opens in a new tab)</span>
          </a>
          <button type="button" class="btn btn-quiet" id="btn-restart" aria-haspopup="dialog">
            <svg class="icon" aria-hidden="true"><use href="#i-restart"/></svg><span class="btn-label">Restart</span>
          </button>
        </div>
      </div>
      <div class="progress-strip" id="progress-strip">
        <p class="progress-text" id="progress-text-strip"></p>
        <div class="progress-bar" id="progress-bar-strip" aria-hidden="true"></div>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <div class="layer layer-page" id="layer-page"></div>
      <div class="layer layer-live is-offstage" id="layer-live" inert></div>
    </main>

    <nav class="controls" id="controls" aria-label="Walkthrough controls">
      <div class="controls-inner">
        <button type="button" class="btn btn-secondary btn-nav" id="btn-back">
          <svg class="icon" aria-hidden="true"><use href="#i-arrowLeft"/></svg><span class="btn-label">Back</span>
        </button>
        <div class="progress" id="progress">
          <p class="progress-text" id="progress-text"></p>
          <div class="progress-bar" id="progress-bar" role="progressbar" aria-valuemin="1"></div>
          <p class="progress-next" id="progress-next"></p>
        </div>
        <div class="seg seg-mode" id="mode-switch" role="group" aria-label="Switch view">
          <button type="button" class="seg-btn" data-mode="presentation" aria-pressed="false">
            <svg class="icon" aria-hidden="true"><use href="#i-slides"/></svg><span class="seg-label seg-label-long">Presentation</span><span class="seg-label seg-label-short">Slides</span>
          </button>
          <button type="button" class="seg-btn" data-mode="live" aria-pressed="false">
            <svg class="icon" aria-hidden="true"><use href="#i-live"/></svg><span class="seg-label seg-label-long">Live statement</span><span class="seg-label seg-label-short">Live</span>
          </button>
        </div>
        <div class="seg seg-device" id="device-switch" role="group" aria-label="Notice screen size">
          <button type="button" class="seg-btn" data-device="desktop" aria-pressed="false">
            <svg class="icon" aria-hidden="true"><use href="#i-desktop"/></svg><span class="seg-label">Desktop</span>
          </button>
          <button type="button" class="seg-btn" data-device="tablet" aria-pressed="false">
            <svg class="icon" aria-hidden="true"><use href="#i-tablet"/></svg><span class="seg-label">Tablet</span>
          </button>
          <button type="button" class="seg-btn" data-device="mobile" aria-pressed="false">
            <svg class="icon" aria-hidden="true"><use href="#i-mobile"/></svg><span class="seg-label">Mobile</span>
          </button>
        </div>
        <button type="button" class="btn btn-primary btn-nav" id="btn-next">
          <span class="btn-label">Next</span><svg class="icon" aria-hidden="true"><use href="#i-arrowRight"/></svg>
        </button>
      </div>
    </nav>
  </div>

  <div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>

  <dialog class="dialog dialog-contents" id="dlg-contents" aria-labelledby="dlg-contents-title">
    <div class="dialog-head">
      <h2 id="dlg-contents-title">Contents</h2>
      <button type="button" class="btn btn-icon" data-close aria-label="Close contents"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div class="dialog-body" id="contents-body"></div>
  </dialog>

  <dialog class="dialog dialog-confirm" id="dlg-restart" aria-labelledby="dlg-restart-title" aria-describedby="dlg-restart-body">
    <h2 id="dlg-restart-title">Restart the walkthrough?</h2>
    <p id="dlg-restart-body">You'll go back to the welcome screen. Your saved place and your activity in the live notice will be cleared.</p>
    <div class="dialog-actions">
      <button type="button" class="btn btn-primary" id="btn-restart-confirm">Restart</button>
      <button type="button" class="btn btn-secondary" data-close>Cancel</button>
    </div>
  </dialog>

  <dialog class="dialog dialog-slide" id="dlg-slide" aria-labelledby="dlg-slide-title">
    <h2 class="sr-only" id="dlg-slide-title">Slide</h2>
    <div class="slide-zoom" id="slide-zoom"></div>
    <p class="zoom-hint" aria-hidden="true">Turn your phone sideways to read the slide.</p>
    <p class="sr-only" id="zoom-live" aria-live="polite" aria-atomic="true"></p>
    <div class="slide-zoom-bar">
      <button type="button" class="btn btn-on-dark" id="zoom-prev"><svg class="icon" aria-hidden="true"><use href="#i-arrowLeft"/></svg><span class="btn-label">Previous</span></button>
      <p class="slide-zoom-count" id="zoom-count"></p>
      <button type="button" class="btn btn-on-dark" id="zoom-next"><span class="btn-label">Next</span><svg class="icon" aria-hidden="true"><use href="#i-arrowRight"/></svg></button>
      <button type="button" class="btn btn-on-dark btn-icon" data-close aria-label="Close the enlarged slide"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
  </dialog>

  <noscript><p class="noscript">This walkthrough needs JavaScript. You can still <a href="notice/">open the live Financing Change Notice</a>.</p></noscript>
</body>
</html>
